<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Ashraful Pranto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* ---------- গ্লোবাল স্টাইল ---------- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .admin-container {
      background: #fff;
      max-width: 900px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      padding: 30px;
      position: relative;
    }
    /* ---------- লগইন স্ক্রিন ---------- */
    #loginScreen {
      text-align: center;
      padding: 40px 20px;
    }
    #loginScreen h1 { color: #2D3436; margin-bottom: 8px; }
    #loginScreen p { color: #6B7280; margin-bottom: 30px; }
    .login-box {
      max-width: 350px;
      margin: 0 auto;
    }
    .login-box input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: 0.2s;
    }
    .login-box input:focus {
      outline: none;
      border-color: #D4A373;
      box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.25);
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: #D4A373;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-box button:hover { background: #B8946A; transform: translateY(-2px); }
    .login-error {
      color: #dc2626;
      background: #fee2e2;
      padding: 10px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
    }

    /* ---------- ড্যাশবোর্ড (লগইনের পর) ---------- */
    #dashboard { display: none; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #F3F4F6;
      padding-bottom: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .admin-header h2 { color: #2D3436; }
    .admin-header h2 i { color: #D4A373; }
    .logout-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover { background: #dc2626; color: #fff; }

    .form-card {
      background: #F9FAFB;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      border: 1px solid #E5E7EB;
    }
    .form-card h3 { margin-bottom: 16px; color: #374151; }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #4B5563;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #E5E7EB;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: 0.2s;
      background: #fff;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
      outline: none;
      border-color: #D4A373;
      box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.2);
    }
    .submit-btn {
      background: #D4A373;
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .submit-btn:hover { background: #B8946A; transform: translateY(-2px); }

    /* ---------- পোস্ট লিস্ট ---------- */
    .post-item {
      background: #fff;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      transition: 0.2s;
    }
    .post-item:hover { border-color: #D4A373; }
    .post-info h4 { color: #1F2937; margin-bottom: 4px; }
    .post-info p { color: #6B7280; font-size: 0.9rem; margin: 0; }
    .post-info small { color: #9CA3AF; font-size: 0.75rem; }
    .post-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: 0.2s;
    }
    .edit-btn { color: #D4A373; }
    .edit-btn:hover { background: #FEF3C7; }
    .delete-btn { color: #dc2626; }
    .delete-btn:hover { background: #fee2e2; }

    .empty-msg {
      text-align: center;
      color: #9CA3AF;
      padding: 30px 0;
    }

    .backup-section {
      margin-top: 30px;
      border-top: 2px dashed #E5E7EB;
      padding-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .backup-btn {
      background: #F3F4F6;
      border: 1px solid #E5E7EB;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .backup-btn:hover { background: #E5E7EB; }

    /* রেসপন্সিভ */
    @media (max-width: 640px) {
      .admin-container { padding: 16px; }
      .post-item { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>

<div class="admin-container" id="appContainer">
  
  <!-- ============================================= -->
  <!-- ১. লগইন স্ক্রিন -->
  <!-- ============================================= -->
  <div id="loginScreen">
    <h1>🔐 Admin Panel</h1>
    <p>আপনার পোর্টফোলিও পরিচালনা করতে লগইন করুন</p>
    <div class="login-box">
      <input type="password" id="passwordInput" placeholder="Enter Password" autofocus>
      <button onclick="handleLogin()">Login <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
      <div class="login-error" id="loginError">❌ ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।</div>
    </div>
  </div>

  <!-- ============================================= -->
  <!-- ২. ড্যাশবোর্ড (লগইনের পর) -->
  <!-- ============================================= -->
  <div id="dashboard">
    <div class="admin-header">
      <h2><i class="fa-solid fa-pen-to-square"></i> Dashboard</h2>
      <div>
        <span style="margin-right:12px; color:#6B7280; font-size:0.85rem;" id="postCount">0 posts</span>
        <button class="logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>

    <!-- নতুন পোস্ট অ্যাড ফর্ম -->
    <div class="form-card">
      <h3>📝 Add New Post</h3>
      <div class="form-group">
        <label>Post Title *</label>
        <input type="text" id="postTitle" placeholder="Enter post title...">
      </div>
      <div class="form-group">
        <label>Image URL (optional)</label>
        <input type="text" id="postImage" placeholder="https://example.com/image.jpg">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="postCategory">
          <option value="general">General</option>
          <option value="seo">SEO</option>
          <option value="ads">Paid Ads</option>
          <option value="social">Social Media</option>
          <option value="strategy">Strategy</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description / Content *</label>
        <textarea id="postDesc" rows="4" placeholder="Write your post content..."></textarea>
      </div>
      <button class="submit-btn" onclick="addPost()"><i class="fa-solid fa-plus"></i> Publish Post</button>
    </div>

    <!-- পোস্ট লিস্ট -->
    <h3 style="margin-bottom:16px; color:#374151;"><i class="fa-solid fa-list"></i> All Posts</h3>
    <div id="postList"></div>

    <!-- ব্যাকআপ সেকশন -->
    <div class="backup-section">
      <button class="backup-btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Download Backup</button>
      <button class="backup-btn" onclick="document.getElementById('importInput').click();"><i class="fa-solid fa-upload"></i> Import Backup</button>
      <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)">
      <button class="backup-btn" style="background:#fee2e2; color:#dc2626;" onclick="clearAllData()"><i class="fa-solid fa-trash"></i> Clear All Data</button>
    </div>
  </div>
</div>

<script>
  // ================================================================
  // কনফিগারেশন: পাসওয়ার্ড (এখানে পরিবর্তন করুন)
  // ================================================================
  const ADMIN_PASSWORD = "admin123"; // ← আপনার পছন্দের পাসওয়ার্ড দিন

  // ================================================================
  // লগইন লজিক
  // ================================================================
  function handleLogin() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('loginError');
    if (input.value === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      error.style.display = 'none';
      loadPosts();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  }
  // এন্টার চাপলে লগইন
  document.getElementById('passwordInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') handleLogin();
  });

  function handleLogout() {
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  // ================================================================
  // লোকালস্টোরেজ অপারেশন
  // ================================================================
  function getPosts() {
    return JSON.parse(localStorage.getItem('adminPosts')) || [];
  }

  function savePosts(posts) {
    localStorage.setItem('adminPosts', JSON.stringify(posts));
  }

  // ================================================================
  // পোস্ট অ্যাড, এডিট, ডিলিট
  // ================================================================
  function addPost() {
    const title = document.getElementById('postTitle').value.trim();
    const image = document.getElementById('postImage').value.trim();
    const category = document.getElementById('postCategory').value;
    const desc = document.getElementById('postDesc').value.trim();

    if (!title || !desc) {
      alert('❌ দয়া করে Title এবং Description পূরণ করুন!');
      return;
    }

    const posts = getPosts();
    posts.push({
      id: Date.now(),
      title: title,
      image: image,
      category: category,
      desc: desc,
      date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
    });
    savePosts(posts);
    clearForm();
    loadPosts();
    alert('✅ পোস্ট সফলভাবে যোগ করা হয়েছে!');
  }

  function deletePost(id) {
    if (!confirm('এই পোস্টটি ডিলিট করবেন?')) return;
    let posts = getPosts();
    posts = posts.filter(p => p.id !== id);
    savePosts(posts);
    loadPosts();
  }

  function editPost(id) {
    const posts = getPosts();
    const post = posts.find(p => p.id === id);
    if (!post) return;

    const newTitle = prompt('Title পরিবর্তন করুন:', post.title);
    if (newTitle === null) return;
    const newDesc = prompt('Description পরিবর্তন করুন:', post.desc);
    if (newDesc === null) return;
    const newImage = prompt('Image URL পরিবর্তন করুন:', post.image);
    if (newImage === null) return;

    post.title = newTitle.trim() || post.title;
    post.desc = newDesc.trim() || post.desc;
    post.image = newImage.trim();
    savePosts(posts);
    loadPosts();
  }

  function clearForm() {
    document.getElementById('postTitle').value = '';
    document.getElementById('postImage').value = '';
    document.getElementById('postCategory').value = 'general';
    document.getElementById('postDesc').value = '';
  }

  // ================================================================
  // পোস্ট রেন্ডার
  // ================================================================
  function loadPosts() {
    const posts = getPosts();
    const container = document.getElementById('postList');
    const count = document.getElementById('postCount');
    count.innerText = posts.length + ' posts';

    if (posts.length === 0) {
      container.innerHTML = `<div class="empty-msg">📭 কোনো পোস্ট নেই। উপরের ফর্ম দিয়ে নতুন পোস্ট যোগ করুন!</div>`;
      return;
    }

    container.innerHTML = posts.map(p => `
      <div class="post-item">
        <div class="post-info">
          <h4>${p.title} <span style="font-size:0.7rem; background:#F3F4F6; padding:2px 10px; border-radius:50px;">${p.category}</span></h4>
          <p>${p.desc.substring(0, 80)}${p.desc.length > 80 ? '...' : ''}</p>
          <small>📅 ${p.date} ${p.image ? '| 🖼️ Image attached' : ''}</small>
        </div>
        <div class="post-actions">
          <button class="edit-btn" onclick="editPost(${p.id})" title="Edit"><i class="fa-solid fa-pen"></i></button>
          <button class="delete-btn" onclick="deletePost(${p.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `).join('');
  }

  // ================================================================
  // ব্যাকআপ (ইমপোর্ট / এক্সপোর্ট)
  // ================================================================
  function exportData() {
    const posts = getPosts();
    const blob = new Blob([JSON.stringify(posts, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-posts-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        if (Array.isArray(data)) {
          if (confirm('বর্তমান সব পোস্ট রিপ্লেস হবে। কি ادامه করবেন?')) {
            savePosts(data);
            loadPosts();
            alert('✅ ব্যাকআপ সফলভাবে ইমপোর্ট করা হয়েছে!');
          }
        } else {
          alert('❌ ভুল ফাইল ফরম্যাট!');
        }
      } catch (err) {
        alert('❌ ফাইলটি ঠিকমতো পড়া যায়নি।');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function clearAllData() {
    if (confirm('⚠️ সব পোস্ট ডিলিট হবে। নিশ্চিত?')) {
      if (confirm('আবারও নিশ্চিত করুন?')) {
        savePosts([]);
        loadPosts();
        alert('সব ডেটা ক্লিয়ার করা হয়েছে।');
      }
    }
  }

  // ================================================================
  // চেক করুন: আগে থেকেই লগইন করা আছে কিনা (সেশন রাখতে)
  // ================================================================
  // (সিম্পল রাখার জন্য সেশন রাখি না, রিলোড করলে আবার লগইন চাইবে)
  // কিন্তু চাইলে localStorage-এ flag রাখতে পারেন। 
  // আমি রেখে দিচ্ছি যাতে রিলোড দিলেও লগইন থাকে।
  if (localStorage.getItem('adminLoggedIn') === 'true') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadPosts();
  }

  // লগইন সাকসেস হলে ফ্ল্যাগ সেট করুন
  const originalLogin = handleLogin;
  handleLogin = function() {
    const input = document.getElementById('passwordInput');
    if (input.value === ADMIN_PASSWORD) {
      localStorage.setItem('adminLoggedIn', 'true');
      originalLogin();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  };

  // লগআউটে ফ্ল্যাগ রিমুভ
  const originalLogout = handleLogout;
  handleLogout = function() {
    localStorage.removeItem('adminLoggedIn');
    originalLogout();
  };

  // পেজ লোড হলে চেক
  window.onload = function() {
    if (localStorage.getItem('adminLoggedIn') === 'true') {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadPosts();
    }
  };
</script>

</body>
</html>
